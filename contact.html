<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Mark Jeremy Cruz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://enaslover1.carrd.co/assets/images/image01.jpg?v=b3bff67a">
</head>

<body>
    <header>
        <h1 id="name">Mark Jeremy Cruz</h1>
        <img id="profile-image" src="images/Mark Jeremy.jpg" alt="Mark Jeremy Cruz" width="200" height="200">
        <br>
        <button onClick="window.location.href='index.html'"
            style="background-color: white; color: rgb(245, 152, 168);">Home</button>
        <button onClick="window.location.href='projects.html'"
            style="background-color: white; color: rgb(245, 152, 168);">Projects</button>
        <button onClick="window.location.href='journey.html'"
            style="background-color: white; color: rgb(245, 152, 168);">Journey</button>
        <button onClick="window.location.href='contact.html'"
            style="background-color: white; color: rgb(245, 152, 168);">Contact</button>
    </header>
    <hr>
    <main>
        <p>
            Want to get in touch with me? Fill up this form and I will get back to you as soon as possible !!
        </p>

        <form action="mailto:markjeremycruzz@gmail.com" method="post" enctype="text/plain">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

            <input type="submit" value="Submit">
        </form>
    </main>
    <footer>
        <p>© 2026 Mark Jeremy Cruz. All rights reserved.</p>
    </footer>
